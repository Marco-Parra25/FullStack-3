name: CI/CD Pipeline RedNorte

on:
  push:
    branches: [ main, test-unificacion, feature/* ]
  pull_request:
    branches: [ main, test-unification ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── BUILD & TEST ─────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    # ─── BUILD MICROSERVICIOS ─────────────────────────────────────
    - name: Build MS Lista Espera
      if: hashFiles('rednorte-project/ms-lista-espera/pom.xml') != ''
      run: |
        cd rednorte-project/ms-lista-espera
        mvn clean compile -DskipTests

    - name: Build MS Reasignación
      if: hashFiles('ms-reasignacion/pom.xml') != ''
      run: |
        cd ms-reasignacion
        mvn clean compile -DskipTests

    - name: Build API Gateway
      if: hashFiles('ms-api-gateway/pom.xml') != ''
      run: |
        cd ms-api-gateway
        mvn clean compile -DskipTests

    # ─── UNIT TESTS ─────────────────────────────────────────────
    - name: Run Tests MS Lista Espera
      if: hashFiles('rednorte-project/ms-lista-espera/pom.xml') != ''
      run: |
        cd rednorte-project/ms-lista-espera
        mvn test
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/test_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres

    - name: Run Tests MS Reasignación
      if: hashFiles('ms-reasignacion/pom.xml') != ''
      run: |
        cd ms-reasignacion
        mvn test
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/test_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres

    - name: Run Tests API Gateway
      if: hashFiles('ms-api-gateway/pom.xml') != ''
      run: |
        cd ms-api-gateway
        mvn test

    # ─── BUILD FRONTEND ─────────────────────────────────────────────
    - name: Setup Node.js
      if: hashFiles('bff/package-lock.json') != ''
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: bff/package-lock.json

    - name: Install BFF dependencies
      if: hashFiles('bff/package-lock.json') != ''
      run: |
        cd bff
        npm ci

    - name: Build BFF
      if: hashFiles('bff/package-lock.json') != ''
      run: |
        cd bff
        npm run build
    
    # ─── SECURITY SCAN ─────────────────────────────────────────────
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'

  # ─── DOCKER BUILD ─────────────────────────────────────────────
  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    strategy:
      matrix:
        service: 
          - ms-lista-espera
          - ms-reasignacion
          - ms-api-gateway
          - bff
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./${{ matrix.service }}/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ─── SECURITY & QUALITY GATES ─────────────────────────────────
  security-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run SonarCloud Scan
      if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != ''
      uses: SonarSource/sonarcloud-github-action@master
      with:
        args: >
          -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Skip SonarCloud Scan
      if: env.SONAR_TOKEN == '' || env.SONAR_PROJECT_KEY == '' || env.SONAR_ORGANIZATION == ''
      run: echo "Saltando SonarCloud scan: SONAR_TOKEN, SONAR_PROJECT_KEY o SONAR_ORGANIZATION no configurados."

  # ─── DEPLOY TO STAGING ───────────────────────────────────────
  deploy-staging:
    needs: [build-and-push, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/test-unificacion' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
    
    - name: Deploy to Staging
      run: |
        export KUBECONFIG=kubeconfig
        
        # Apply namespace
        kubectl apply -f k8s/namespace-staging.yaml
        
        # Deploy databases
        kubectl apply -f k8s/postgres-lista-espera-staging.yaml
        kubectl apply -f k8s/postgres-reasignacion-staging.yaml
        
        # Wait for databases
        kubectl wait --for=condition=ready pod -l app=postgres-lista-espera -n rednorte-staging --timeout=300s
        kubectl wait --for=condition=ready pod -l app=postgres-reasignacion -n rednorte-staging --timeout=300s
        
        # Deploy microservices
        kubectl apply -f k8s/ms-lista-espera-staging.yaml
        kubectl apply -f k8s/ms-reasignacion-staging.yaml
        kubectl apply -f k8s/ms-api-gateway-staging.yaml
        kubectl apply -f k8s/bff-staging.yaml
        
        # Wait for microservices
        kubectl wait --for=condition=ready pod -l app=ms-lista-espera -n rednorte-staging --timeout=300s
        kubectl wait --for=condition=ready pod -l app=ms-reasignacion -n rednorte-staging --timeout=300s
        kubectl wait --for=condition=ready pod -l app=ms-api-gateway -n rednorte-staging --timeout=300s
        kubectl wait --for=condition=ready pod -l app=bff -n rednorte-staging --timeout=300s
    
    - name: Deploy Monitoring
      run: |
        export KUBECONFIG=kubeconfig
        
        # Deploy monitoring stack
        kubectl apply -f k8s/prometheus-staging.yaml
        kubectl apply -f k8s/grafana-staging.yaml
        
        # Wait for monitoring
        kubectl wait --for=condition=ready pod -l app=prometheus -n rednorte-staging --timeout=300s
        kubectl wait --for=condition=ready pod -l app=grafana -n rednorte-staging --timeout=300s
    
    - name: Health Check
      run: |
        export KUBECONFIG=kubeconfig
        
        # Get service URLs
        GATEWAY_URL=$(kubectl get svc ms-api-gateway -n rednorte-staging -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        
        # Health checks
        curl -f http://$GATEWAY_URL/actuator/health || exit 1
        curl -f http://$GATEWAY_URL/api/lista-espera/actuator/health || exit 1
        
        echo "✅ Staging deployment successful"
        echo "🌐 Gateway URL: http://$GATEWAY_URL"

  # ─── DEPLOY TO PRODUCTION ─────────────────────────────────────
  deploy-production:
    needs: [build-and-push, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
    
    - name: Deploy to Production
      run: |
        export KUBECONFIG=kubeconfig
        
        # Blue-Green deployment strategy
        CURRENT_VERSION=$(kubectl get deployment ms-api-gateway -n rednorte-prod -o jsonpath='{.metadata.labels.version}' || echo "none")
        NEW_VERSION="${{ github.sha }}"
        
        # Deploy to green environment
        sed "s/VERSION/$NEW_VERSION/g" k8s/ms-api-gateway-prod.yaml | kubectl apply -f -
        
        # Wait for green deployment
        kubectl wait --for=condition=ready pod -l app=ms-api-gateway,version=$NEW_VERSION -n rednorte-prod --timeout=600s
        
        # Health check on green
        GREEN_URL=$(kubectl get svc ms-api-gateway-green -n rednorte-prod -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        curl -f http://$GREEN_URL/actuator/health || exit 1
        
        # Switch traffic to green
        kubectl patch service ms-api-gateway -n rednorte-prod -p '{"spec":{"selector":{"version":"'$NEW_VERSION'"}}}'
        
        echo "✅ Production deployment successful"
        echo "🌐 Production URL: http://$GREEN_URL"
    
    - name: Cleanup old version
      run: |
        export KUBECONFIG=kubeconfig
        
        # Remove old blue deployment after successful green deployment
        if [ "$CURRENT_VERSION" != "none" ] && [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
          kubectl delete deployment ms-api-gateway-blue -n rednorte-prod --ignore-not-found=true
          kubectl delete service ms-api-gateway-blue -n rednorte-prod --ignore-not-found=true
        fi

  # ─── NOTIFICATIONS ─────────────────────────────────────────────
  notify:
    needs: [deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify Slack on Success
      if: needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success'
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        message: |
          🚀 Deployment successful!
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Environment: ${{ needs.deploy-staging.result == 'success' && 'Staging' || 'Production' }}
    
    - name: Notify Slack on Failure
      if: needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure'
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        message: |
          ❌ Deployment failed!
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Environment: ${{ needs.deploy-staging.result == 'failure' && 'Staging' || 'Production' }}
          Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
