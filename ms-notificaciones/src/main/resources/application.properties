spring.application.name=ms-notificaciones
server.port=8081

# Token REST para proteger /api/notificaciones/**
# En produccion definir NOTIFICACIONES_API_TOKEN como variable de entorno.
notificaciones.api-token=${NOTIFICACIONES_API_TOKEN:PyBZ87EaOXgAZVRFIanBRMYZ6DmPZnSM0iGBgxCxQI}

# Configuracion de Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notificaciones-group
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializacion de JSON
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Indica a Kafka que intente mapear el JSON directamente a tu clase DTO
spring.kafka.consumer.properties.spring.json.value.default.type=org.msnotificaciones.infrastructure.adapter.in.kafka.dto.CupoAsignadoDTO