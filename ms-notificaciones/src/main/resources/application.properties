spring.application.name=ms-notificaciones
server.port=8081

# Token REST para proteger /api/notificaciones/**
# En produccion definir NOTIFICACIONES_API_TOKEN como variable de entorno.
notificaciones.api-token=${NOTIFICACIONES_API_TOKEN:PyBZ87EaOXgAZVRFIanBRMYZ6DmPZnSM0iGBgxCxQI}

# Configuracion de Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notificaciones-group
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializacion de JSON
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Indica a Kafka que intente mapear el JSON directamente a tu clase DTO
spring.kafka.consumer.properties.spring.json.value.default.type=org.msnotificaciones.infrastructure.adapter.in.kafka.dto.CupoAsignadoDTO

# Configuracion de email. En local funciona con MailHog/Mailpit en localhost:1025.
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}

notificaciones.email.enabled=${NOTIFICACIONES_EMAIL_ENABLED:true}
notificaciones.email.from=${NOTIFICACIONES_EMAIL_FROM:no-reply@rednorte.local}
notificaciones.email.subject=${NOTIFICACIONES_EMAIL_SUBJECT:Cupo medico reasignado}
