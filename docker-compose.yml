services:

  # ─── BASES DE DATOS ───────────────────────────────────────────────
  postgres-lista-espera:
    image: postgres:15-alpine
    container_name: postgres-lista-espera
    environment:
      POSTGRES_DB: lista_espera_db
      POSTGRES_USER: rednorte
      POSTGRES_PASSWORD: rednorte123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rednorte -d lista_espera_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rednorte-network

  postgres-reasignacion:
    image: postgres:15-alpine
    container_name: postgres-reasignacion
    environment:
      POSTGRES_DB: reasignacion_db
      POSTGRES_USER: rednorte
      POSTGRES_PASSWORD: rednorte123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rednorte -d reasignacion_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rednorte-network

  # ─── KAFKA ────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - rednorte-network

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - rednorte-network

  # ─── KEYCLOAK ─────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
    ports:
      - "8090:8080"
    volumes:
      - ./testing/keycloak/realm-rednorte.json:/opt/keycloak/data/import/realm-rednorte.json:ro
      - keycloak-data:/opt/keycloak/data
    networks:
      - rednorte-network

  keycloak-setup:
    image: curlimages/curl:latest
    container_name: keycloak-setup
    depends_on:
      keycloak:
        condition: service_started
    entrypoint: ["/bin/sh", "/scripts/assign-realm-admin.sh"]
    volumes:
      - ./testing/keycloak/assign-realm-admin.sh:/scripts/assign-realm-admin.sh:ro
    networks:
      - rednorte-network
    restart: "no"

  # ─── MICROSERVICIOS ───────────────────────────────────────────────
  ms-lista-espera:
    build:
      context: ./rednorte-project/ms-lista-espera
      dockerfile: Dockerfile
    container_name: ms-lista-espera
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-lista-espera:5432/lista_espera_db
      SPRING_DATASOURCE_USERNAME: rednorte
      SPRING_DATASOURCE_PASSWORD: rednorte123
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDNORTE_INTERNAL_TOKEN: dev-internal-token
      SERVER_PORT: 8081
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/rednorte
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/rednorte/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_started
      postgres-lista-espera:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    networks:
      - rednorte-network

  ms-reasignacion:
    build:
      context: ./ms-reasignacion
      dockerfile: Dockerfile
    container_name: ms-reasignacion
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-reasignacion:5432/reasignacion_db
      SPRING_DATASOURCE_USERNAME: rednorte
      SPRING_DATASOURCE_PASSWORD: rednorte123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LISTA_ESPERA_BASE_URL: http://ms-lista-espera:8081
      REDNORTE_INTERNAL_TOKEN: dev-internal-token
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/rednorte
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/rednorte/protocol/openid-connect/certs
      SERVER_PORT: 8082
    depends_on:
      postgres-reasignacion:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - rednorte-network

  ms-notificaciones:
    build:
      context: ./ms-notificaciones
      dockerfile: Dockerfile
    container_name: ms-notificaciones
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?Define SPRING_MAIL_USERNAME in .env}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?Define SPRING_MAIL_PASSWORD in .env}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-true}
      NOTIFICACIONES_EMAIL_ENABLED: ${NOTIFICACIONES_EMAIL_ENABLED:-true}
      NOTIFICACIONES_EMAIL_FROM: ${NOTIFICACIONES_EMAIL_FROM:?Define NOTIFICACIONES_EMAIL_FROM in .env}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/rednorte
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/rednorte/protocol/openid-connect/certs
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - rednorte-network

  ms-api-gateway:
    build:
      context: ./ms-api-gateway
      dockerfile: Dockerfile
    container_name: ms-api-gateway
    ports:
      - "8088:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/rednorte
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/rednorte/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_started
      ms-lista-espera:
        condition: service_healthy
      ms-reasignacion:
        condition: service_started
    networks:
      - rednorte-network

  # ─── BFF ──────────────────────────────────────────────────────────
  bff:
    build:
      context: ./bff
      dockerfile: Dockerfile
    container_name: bff
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      API_GATEWAY_URL: http://ms-api-gateway:8080
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_ID: rednorte-api
      KEYCLOAK_CLIENT_SECRET: rednorte-secret
      KEYCLOAK_REALM: rednorte
    depends_on:
      - ms-api-gateway
    networks:
      - rednorte-network

  # ─── FRONTEND ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BFF_URL: http://localhost:3001
        VITE_KEYCLOAK_URL: http://localhost:3001
        VITE_KEYCLOAK_CLIENT_ID: rednorte-api
        VITE_USE_MOCK_AUTH: "false"
        VITE_GATEWAY_URL: http://localhost:8088
        VITE_GRAFANA_URL: http://localhost:3002
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - bff
    networks:
      - rednorte-network

  # ─── MONITOREO ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - rednorte-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: viewer
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - rednorte-network

networks:
  rednorte-network:
    driver: bridge

volumes:
  grafana-data:
  keycloak-data:
