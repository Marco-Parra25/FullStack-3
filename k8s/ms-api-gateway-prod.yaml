apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-api-gateway-blue
  namespace: rednorte-prod
  labels:
    app: ms-api-gateway
    version: blue
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ms-api-gateway
      version: blue
  template:
    metadata:
      labels:
        app: ms-api-gateway
        version: blue
        environment: production
    spec:
      containers:
      - name: ms-api-gateway
        image: ghcr.io/marco-parra25/fullstack-3/ms-api-gateway:latest
        ports:
        - containerPort: 8080
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms-api-gateway-blue
  namespace: rednorte-prod
  labels:
    app: ms-api-gateway
    version: blue
    environment: production
spec:
  selector:
    app: ms-api-gateway
    version: blue
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-api-gateway-green
  namespace: rednorte-prod
  labels:
    app: ms-api-gateway
    version: green
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ms-api-gateway
      version: green
  template:
    metadata:
      labels:
        app: ms-api-gateway
        version: green
        environment: production
    spec:
      containers:
      - name: ms-api-gateway
        image: ghcr.io/marco-parra25/fullstack-3/ms-api-gateway:VERSION
        ports:
        - containerPort: 8080
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms-api-gateway-green
  namespace: rednorte-prod
  labels:
    app: ms-api-gateway
    version: green
    environment: production
spec:
  selector:
    app: ms-api-gateway
    version: green
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ms-api-gateway
  namespace: rednorte-prod
  labels:
    app: ms-api-gateway
    environment: production
spec:
  selector:
    app: ms-api-gateway
    version: blue  # Default to blue
  ports:
  - port: 8080
    targetPort: 8080
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-api-gateway-ingress
  namespace: rednorte-prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: rednorte.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ms-api-gateway
            port:
              number: 8080
