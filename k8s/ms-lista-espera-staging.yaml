apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-lista-espera
  namespace: rednorte-staging
  labels:
    app: ms-lista-espera
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-lista-espera
  template:
    metadata:
      labels:
        app: ms-lista-espera
        environment: staging
    spec:
      containers:
      - name: ms-lista-espera
        image: ghcr.io/marco-parra25/fullstack-3/ms-lista-espera:latest
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres-lista-espera:5432/lista_espera_db
        - name: SPRING_DATASOURCE_USERNAME
          value: rednorte
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rednorte-secrets
              key: postgres-password
        - name: SPRING_FLYWAY_ENABLED
          value: "true"
        - name: SERVER_PORT
          value: "8081"
        - name: SPRING_PROFILES_ACTIVE
          value: "staging"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms-lista-espera
  namespace: rednorte-staging
  labels:
    app: ms-lista-espera
    environment: staging
spec:
  selector:
    app: ms-lista-espera
  ports:
  - port: 8081
    targetPort: 8081
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-lista-espera-hpa
  namespace: rednorte-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-lista-espera
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
