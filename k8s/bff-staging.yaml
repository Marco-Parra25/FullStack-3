apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: rednorte-staging
  labels:
    app: bff
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
        environment: staging
    spec:
      containers:
      - name: bff
        image: ghcr.io/marco-parra25/fullstack-3/bff:latest
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: API_GATEWAY_URL
          value: http://ms-api-gateway:8080
        - name: NODE_ENV
          value: "staging"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: rednorte-staging
  labels:
    app: bff
    environment: staging
spec:
  selector:
    app: bff
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bff-hpa
  namespace: rednorte-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bff
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
