          },
          {
            "id": 2,
            "title": "MS Reasignación - Health",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=\"ms-reasignacion\"}",
                "legendFormat": "Status"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "mappings": [
