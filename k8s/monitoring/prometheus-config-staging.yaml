apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: rednorte-staging
  labels:
    app: prometheus
    environment: staging
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'rednorte-staging'
        environment: 'staging'

    scrape_configs:
      # Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
        scrape_interval: 30s
        metrics_path: /metrics

      # MS Lista de Espera
      - job_name: 'ms-lista-espera'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ms-lista-espera:8081']
        scrape_interval: 15s
        metrics_path: /actuator/prometheus

      # MS Reasignación
      - job_name: 'ms-reasignacion'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ms-reasignacion:8082']
        scrape_interval: 15s
        metrics_path: /actuator/prometheus

      # MS API Gateway
      - job_name: 'ms-api-gateway'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ms-api-gateway:8080']
        scrape_interval: 15s
        metrics_path: /actuator/prometheus

      # BFF
      - job_name: 'bff'
        metrics_path: /metrics
        static_configs:
          - targets: ['bff:3001']
        scrape_interval: 30s

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []
