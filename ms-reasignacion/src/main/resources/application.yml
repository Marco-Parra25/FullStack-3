server:
  port: 8082

spring:
  application:
    name: ms-reasignacion

  # --- SEGURIDAD (OAUTH2) ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://keycloak:8080/realms/rednorte}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://keycloak:8080/realms/rednorte/protocol/openid-connect/certs}

  # --- BASE DE DATOS ---
  datasource:
    url: jdbc:postgresql://localhost:5432/reasignacion_db
    username: rednorte
    password: rednorte123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  # --- MENSAJERÍA KAFKA ---
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: reasignacion-grupo
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: org.msreasignacion.domain.event.CupoLiberadoEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

rednorte:
  services:
    lista-espera:
      base-url: ${LISTA_ESPERA_BASE_URL:http://localhost:8081}
      internal-token: ${REDNORTE_INTERNAL_TOKEN:dev-internal-token}
  kafka:
    topics:
      cupo-asignado: ${TOPIC_CUPO_ASIGNADO:cupo-asignado}
    send-timeout-ms: ${KAFKA_SEND_TIMEOUT_MS:5000}

# --- RESILIENCIA ---
resilience4j:
  circuitbreaker:
    instances:
      backendReasignacion:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED

# --- MONITOREO (ACTUATOR) ---
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
